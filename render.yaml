# Render Blueprint — deploys CRM Builder on Render's free tier.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: crmbuilder
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Set these in the Render dashboard (see DEPLOYMENT.md):
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
