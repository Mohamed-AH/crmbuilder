# Nightly backup, because MongoDB M0 has none.
#
# The free Atlas tier gives no automated backups and no point-in-time recovery,
# so this is the whole safety net for beta users' data. It pulls the deployment's
# export and keeps it as a build artifact.
#
# Two secrets are required, and the job is a no-op without them:
#   BACKUP_URL    the deployment, e.g. https://crmbuilder-v1.onrender.com
#   BACKUP_TOKEN  the same value as the BACKUP_TOKEN env var on the service
#
# The token goes in a header, never the URL — Render logs request URLs, and a
# token in a query string is a credential written to plaintext logs.
name: Nightly backup

on:
  schedule:
    # 03:20 UTC. Deliberately not on the hour: GitHub's scheduled queue is
    # busiest then, and this job has no reason to compete for it.
    - cron: '20 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Export and keep
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set
        id: check
        env:
          URL: ${{ secrets.BACKUP_URL }}
          TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "BACKUP_URL or BACKUP_TOKEN is not set — skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the export
        if: steps.check.outputs.ready == 'true'
        env:
          URL: ${{ secrets.BACKUP_URL }}
          TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%d)"
          # --fail-with-body so an error page is never mistaken for a backup,
          # and a generous timeout because a sleeping free instance takes a
          # minute to wake.
          curl --fail-with-body --silent --show-error \
               --max-time 300 --retry 3 --retry-delay 20 \
               -H "Authorization: Bearer ${TOKEN}" \
               -o "crmbuilder-backup-${stamp}.json" \
               "${URL%/}/api/admin/export"

          # A backup nobody looked at is a rumour. Fail loudly if it is not
          # the shape a restore expects.
          node -e '
            const fs = require("fs");
            const file = process.argv[1];
            const b = JSON.parse(fs.readFileSync(file, "utf8"));
            if (b.kind !== "backup") throw new Error("not a backup document");
            const records = (b.workspaces || []).reduce((n, w) => n + (w.records || []).length, 0);
            console.log(`${b.workspaces.length} workspace(s), ${b.users.length} account(s), ${records} record(s)`);
            console.log(`${(fs.statSync(file).size / 1024).toFixed(1)} kB`);
          ' "crmbuilder-backup-${stamp}.json"

      - name: Keep it
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crmbuilder-backup
          path: crmbuilder-backup-*.json
          retention-days: 30
          if-no-files-found: error

      # LAST on purpose. Healthchecks alerts on a ping that does NOT arrive, so
      # what this reports is "a validated backup was fetched AND stored". Put it
      # before "Keep it" and it would report success for a backup that was never
      # uploaded.
      #
      # `ready == 'true'` is doing two jobs here, and the first is the whole
      # reason this step exists. When the secrets are unset this job SKIPS and
      # the run goes GREEN — which is how it produced no backups at all for
      # weeks while the Actions history showed a tick every night. An
      # unconditional ping would have told Healthchecks "fine" every one of
      # those nights. The second job is free: a failed step short-circuits the
      # ones after it, so a fetch that 401s, or a payload that fails the shape
      # check, never reaches this either.
      #
      # It also covers the failure this was added for — GitHub disables
      # scheduled workflows after 60 days of repository inactivity, silently.
      # No run, no ping, and Healthchecks says so.
      #
      # HEALTHCHECK_URL is a bearer credential: anyone holding it can fake a
      # success. It lives in a secret and is never echoed into the log.
      - name: Tell Healthchecks the backup landed
        if: steps.check.outputs.ready == 'true'
        env:
          PING: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$PING" ]; then
            echo "HEALTHCHECK_URL is not set — this backup has no dead-man's switch."
            exit 0
          fi
          # Deliberately NOT fatal. The backup succeeded and is stored, so
          # failing here would paint a red run over work that was done
          # correctly — and Healthchecks already alerts on the missing ping.
          # The warning is what tells you the URL is wrong rather than the
          # deployment being down, which are opposite problems.
          if curl --fail --silent --show-error --max-time 10 \
                  --retry 3 --retry-delay 5 -o /dev/null "$PING"; then
            echo "Pinged Healthchecks."
          else
            echo "::warning::Backup succeeded but the Healthchecks ping failed — check HEALTHCHECK_URL."
          fi
