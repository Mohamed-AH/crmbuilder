name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Every morning, check the live deployment is still healthy.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      live_url:
        description: 'Deployment to smoke test (defaults to the LIVE_URL variable)'
        required: false
        type: string

jobs:
  test:
    name: Unit, API and end-to-end
    # Scheduled runs only need the live smoke test.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Unit tests (CSV)
        run: npm run test:unit

      - name: API contract tests
        run: npm run test:api

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Smoke test the local build
        run: |
          DATA_DIR=./data/ci node server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8321/healthz >/dev/null && break
            sleep 1
          done
          node tests/smoke.mjs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Dependency and secret scan
    # Scheduled runs only check the live deployment.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans git history. A shallow clone would scan one commit,
          # find nothing, and report clean — a false pass, which is worse than
          # no scan at all because it looks like coverage.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gate. Production dependencies only: a Playwright advisory should
      # not block a deploy of the server, and there are four production deps to
      # keep clean. High and critical fail; anything lower is reported below.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Everything, including dev, for the record. Never fails the build.
      - name: Full dependency report
        if: always()
        run: npm audit || true

      # Pinned binary rather than gitleaks/gitleaks-action, which wants a
      # GITLEAKS_LICENSE for organisation-owned repositories. Pinning the
      # version and checking the digest means CI runs exactly what was
      # reviewed here.
      #
      # --redact is not optional: without it a finding prints the secret into
      # the build log, and on a public repository that log is public. A scanner
      # that publishes what it found is worse than no scanner.
      - name: Secret scan (gitleaks)
        continue-on-error: true
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  live:
    name: Live deployment health
    # Runs on every push, on the daily schedule, and on manual dispatch.
    # (It used to say "after a push to the default branch"; there has never
    # been a branch filter, and the branch that is deployed is the one being
    # worked on — so the comment was describing an intention, not the code.)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # ------------------------------------------------------------------
      # A PUSH RUN AND THE DAILY RUN ARE ASKING DIFFERENT QUESTIONS (§46).
      #
      # This job smoke-tests the LIVE deployment using the asset list from the
      # commit that was just pushed — and Render has not finished deploying
      # that commit yet. So a file added in this push 404s, the audit reports
      # "Deployment is NOT healthy", and a re-run half an hour later is green.
      # That happened with /js/dsar.js, and it is testing the wrong build
      # rather than finding anything.
      #
      # On a push: wait for the deployment to report the pushed commit, then
      # smoke it. If it never does, the build under test is not live and its
      # expectations do not apply — say so and stop, rather than failing.
      #
      # On the schedule or a manual run: do NOT wait and do NOT skip. Nothing
      # is in flight, so a stale deployment failing the current asset list is
      # a REAL finding — a deploy that never landed. That is the run that has
      # to be able to fail, and it is why the skip above cannot be silent
      # (§17: a no-op that reports success is worse than a failure).
      # ------------------------------------------------------------------
      - name: Wait for the deployment to catch up
        id: deployed
        if: github.event_name == 'push'
        env:
          BASE_URL: ${{ inputs.live_url || vars.LIVE_URL || 'https://crmbuilder-v1.onrender.com' }}
          WANT: ${{ github.sha }}
          # Render's free tier redeploys in a couple of minutes, plus a cold
          # start. Generous, because the cost of waiting is a CI minute and the
          # cost of not waiting is a red tick nobody trusts.
          BUDGET_SECONDS: 420
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + BUDGET_SECONDS ))
          reported=""
          answered=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -sf --max-time 90 "$BASE_URL/healthz" || true)
            [ -n "$body" ] && answered=yes
            reported=$(printf '%s' "$body" | node -e \
              'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{process.stdout.write(JSON.parse(s).commit||"")}catch{}})')
            # No commit reported at all: this deployment predates the field, or
            # runs somewhere that does not set it. We cannot gate on something
            # it does not say, so behave exactly as before.
            if [ -z "$reported" ] && [ -n "$body" ]; then
              echo "The deployment does not report a commit — smoke testing it as-is."
              echo "state=unknown" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$reported" = "$WANT" ]; then
              echo "Live deployment is running ${WANT:0:12}."
              echo "state=current" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$reported" ]; then
              echo "Live deployment is running ${reported:0:12}, waiting for ${WANT:0:12}…"
            else
              echo "No answer from $BASE_URL yet, waiting for ${WANT:0:12}…"
            fi
            sleep 20
          done
          echo "state=stale" >> "$GITHUB_OUTPUT"
          # Two different problems, and "still running <nothing>" describes
          # neither. The daily run is the backstop for both.
          if [ -z "$answered" ]; then
            echo "::warning::$BASE_URL did not answer /healthz within ${BUDGET_SECONDS}s, so which commit is live could not be established. Skipping the live smoke. If this is not a redeploy in progress, the deployment is down — the daily scheduled run will fail loudly."
          else
            echo "::warning::Live deployment is still running ${reported:0:12} after ${BUDGET_SECONDS}s, not ${WANT:0:12}. Skipping the live smoke: it would assert this commit's assets against an older build. The daily scheduled run will catch a deploy that never lands."
          fi

      - name: Smoke test the live deployment
        # Skipped only when a push run proved the deployment is behind. The
        # scheduled and manual runs have no `deployed` step, so `state` is
        # empty and this always runs for them.
        if: steps.deployed.outputs.state != 'stale'
        env:
          # Defaults to the production deployment. Override per-run via the
          # workflow_dispatch input, or permanently with a repository variable
          # named LIVE_URL (Settings → Secrets and variables → Actions → Variables).
          BASE_URL: ${{ inputs.live_url || vars.LIVE_URL || 'https://crmbuilder-v1.onrender.com' }}
        run: |
          echo "Smoke testing $BASE_URL"
          node tests/smoke.mjs
