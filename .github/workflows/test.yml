name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Every morning, check the live deployment is still healthy.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      live_url:
        description: 'Deployment to smoke test (defaults to the LIVE_URL variable)'
        required: false
        type: string

jobs:
  test:
    name: Unit, API and end-to-end
    # Scheduled runs only need the live smoke test.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Unit tests (CSV)
        run: npm run test:unit

      - name: API contract tests
        run: npm run test:api

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Smoke test the local build
        run: |
          DATA_DIR=./data/ci node server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8321/healthz >/dev/null && break
            sleep 1
          done
          node tests/smoke.mjs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Dependency and secret scan
    # Scheduled runs only check the live deployment.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans git history. A shallow clone would scan one commit,
          # find nothing, and report clean — a false pass, which is worse than
          # no scan at all because it looks like coverage.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gate. Production dependencies only: a Playwright advisory should
      # not block a deploy of the server, and there are four production deps to
      # keep clean. High and critical fail; anything lower is reported below.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Everything, including dev, for the record. Never fails the build.
      - name: Full dependency report
        if: always()
        run: npm audit || true

      # Pinned binary rather than gitleaks/gitleaks-action, which wants a
      # GITLEAKS_LICENSE for organisation-owned repositories. Pinning the
      # version and checking the digest means CI runs exactly what was
      # reviewed here.
      #
      # --redact is not optional: without it a finding prints the secret into
      # the build log, and on a public repository that log is public. A scanner
      # that publishes what it found is worse than no scanner.
      - name: Secret scan (gitleaks)
        continue-on-error: true
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  live:
    name: Live deployment health
    # Runs on schedule, on manual dispatch, and after a push to the default branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Smoke test the live deployment
        env:
          # Defaults to the production deployment. Override per-run via the
          # workflow_dispatch input, or permanently with a repository variable
          # named LIVE_URL (Settings → Secrets and variables → Actions → Variables).
          BASE_URL: ${{ inputs.live_url || vars.LIVE_URL || 'https://crmbuilder-v1.onrender.com' }}
        run: |
          echo "Smoke testing $BASE_URL"
          node tests/smoke.mjs
