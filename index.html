<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CRM Builder</title>
  <meta name="description" content="Build your own modular CRM for your small business. Pick the modules you need, add custom fields, and work offline — your data stays on your device.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Toggle menu">☰</button>
      <span class="brand-mini">CRM Builder</span>
    </header>
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-name">CRM Builder</span>
      </div>
      <nav id="nav-main">
        <a href="#/" data-route="dashboard" class="nav-link"><span class="nav-icon">◫</span> Dashboard</a>
      </nav>
      <div class="nav-section">
        <span class="nav-section-title">Modules</span>
        <button id="add-module-btn" class="icon-btn" title="New module" aria-label="New module">+</button>
      </div>
      <nav id="nav-modules"></nav>
      <div class="sidebar-footer">
        <a href="#/settings" data-route="settings" class="nav-link"><span class="nav-icon">⚙</span> Settings</a>
        <button id="install-btn" class="btn btn-ghost hidden">⬇ Install app</button>
        <span id="offline-badge" class="offline-badge hidden">Offline — changes saved locally</span>
      </div>
    </aside>
    <div id="scrim"></div>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="js/db.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
